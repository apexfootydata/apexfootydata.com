/* 2026-07-10: returning-visitor fast path decided BEFORE first paint, so the
   ID entry form never flashes and then vanishes on the way to the solver. */
(function () {
  /* APEX_NO_STUB_LANDING_v1 (2026-08-21): this standalone ID-entry page is
     retired -- the solver app renders its own landing now. This shell only
     forwards old links/bookmarks: with a remembered id straight into the
     app, otherwise to the app's landing (?change=1 preserved). */
  try {
    document.documentElement.style.visibility = 'hidden';
    var stay = /[?&]change=1\b/.test(location.search);
    var saved = null;
    try { saved = localStorage.getItem('apex_fpl_id'); } catch (_s) {}
    if (!stay && saved && /^\d+$/.test(saved)) {
      window.location.replace('/solver_app.html?id=' + saved);
    } else {
      window.location.replace('/');   // THE HOMEPAGE IS THE LANDING PAGE
    }
  } catch (_) { window.location.replace('/'); }
})();
</script>

    <h1>Solver</h1>
    <p class="sub">Enter your FPL Team ID to get started.</p>
    <input id="fpl-id" type="text" inputmode="numeric" pattern="[0-9]*"
           placeholder="Your FPL Team ID" autofocus autocomplete="off" maxlength="10">
    <button id="go" onclick="run()">Solve My Team</button>
    <div class="err" id="err"></div>
    <div class="status" id="status"></div>
    <div class="hint">
      Don't know your ID? Log in at fantasy.premierleague.com,

<script>
  const input    = document.getElementById('fpl-id');
  const errEl    = document.getElementById('err');
  const statusEl = document.getElementById('status');
  const goBtn    = document.getElementById('go');

  input.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
  input.addEventListener('input', () => { errEl.textContent = ''; statusEl.textContent = ''; });

  function run() {
    const raw = input.value.trim();
    if (!raw) { errEl.textContent = 'Enter your FPL Team ID to continue.'; input.focus(); return; }
    if (!/^\d+$/.test(raw)) { errEl.textContent = 'Team ID must be numeric.'; input.focus(); return; }
    const id = parseInt(raw, 10);
    if (id < 1 || id > 20000000) { errEl.textContent = 'That doesn\'t look like a valid Team ID.'; input.focus(); return; }
    errEl.textContent = '';
    statusEl.textContent = `Building solver for team ${id}...`;
    goBtn.disabled = true;
    try { localStorage.setItem('apex_fpl_id', String(id)); } catch (_) {}
    window.location.href = `/solver_app.html?id=${id}`;
  }
  try {
    var _saved = localStorage.getItem('apex_fpl_id');
    // Returning visitor: if we already know a valid Team ID, skip the entry box
    // and go straight to their solver. New visitors (no saved ID) still see it.
    // Escape hatch: /solver.html?change=1 stays on the box to enter a different ID.
    var _stay = /[?&]change=1\b/.test(location.search);
    if (_saved && /^\d+$/.test(_saved)) {
      if (_stay) { input.value = _saved; }
      else { window.location.replace('/solver_app.html?id=' + _saved); }
    }
  } catch (_) {}
</script>

/* ============================================================================
 * apex_mobile.js -- runtime mobile fixes for fplapex.com
 *
 * Wraps any <table> wider than its parent in a .apex-table-scroll div so it
 * scrolls horizontally inside the page rather than pushing the body wider
 * (which would force mobile browsers to zoom out).
 *
 * Idempotent. Re-runs on tab/data renders via MutationObserver.
 * ========================================================================== */
(function () {
    'use strict';
    var WRAP_CLASS = 'apex-table-scroll';
    var WRAPPED_ATTR = 'data-apex-wrapped';

    function wrapOne(table) {
        if (!table || table.getAttribute(WRAPPED_ATTR) === '1') return false;
        var parent = table.parentElement;
        if (!parent) return false;
        if (parent.classList && parent.classList.contains(WRAP_CLASS)) return false;
        if (table.hasAttribute('data-no-scroll')) return false;

        var tableW = table.scrollWidth || table.offsetWidth || 0;
        var availW = parent.clientWidth || window.innerWidth || 0;
        if (tableW <= availW + 1) return false;

        var wrap = document.createElement('div');
        wrap.className = WRAP_CLASS;
        parent.insertBefore(wrap, table);
        wrap.appendChild(table);
        table.setAttribute(WRAPPED_ATTR, '1');
        attachScrollState(wrap);
        return true;
    }

    function attachScrollState(wrap) {
        function update() {
            var fits = wrap.scrollWidth <= wrap.clientWidth + 2;
            var atEnd = wrap.scrollLeft + wrap.clientWidth >= wrap.scrollWidth - 2;
            wrap.classList.toggle('is-fits', fits);
            wrap.classList.toggle('is-scrolled-end', !fits && atEnd);
        }
        update();
        wrap.addEventListener('scroll', update, { passive: true });
        setTimeout(update, 600);
        setTimeout(update, 2000);
        if (window.ResizeObserver) {
            try { new ResizeObserver(update).observe(wrap); } catch (e) {}
        } else {
            window.addEventListener('resize', update);
        }
    }

    function wrapAll() {
        var tables = document.querySelectorAll('table');
        for (var i = 0; i < tables.length; i++) wrapOne(tables[i]);
    }

    function boot() {
        wrapAll();
        setTimeout(wrapAll, 500);
        setTimeout(wrapAll, 1500);
        setTimeout(wrapAll, 4000);

        if (window.MutationObserver) {
            var pending = false;
            var mo = new MutationObserver(function () {
                if (pending) return;
                pending = true;
                requestAnimationFrame(function () {
                    pending = false;
                    wrapAll();
                });
            });
            mo.observe(document.body, { childList: true, subtree: true });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }

    window.__apexMobileRewrap = wrapAll;
})();

// ── Mobile: abbreviate Team Ratings headers (2026-05-14) ──────────────────
// CSS pseudo-element trick was unreliable (OVR going missing). Rewrite the
// actual th text on narrow viewports. Idempotent — keeps original in data-*
// so it can be restored if window widens.
(function () {
    'use strict';
    var ABBREV = { 'ATTACK': 'ATT', 'DEFENCE': 'DEF', 'DEFENSE': 'DEF', 'OVERALL': 'OVR' };
    var ATTR_ORIG = 'data-apex-orig-th';

    function shouldAbbrev() { return window.innerWidth <= 480; }

    function applyHeaderAbbrev() {
        var tables = document.querySelectorAll('table.data-table');
        for (var i = 0; i < tables.length; i++) {
            var ths = tables[i].querySelectorAll('thead th');
            for (var j = 0; j < ths.length; j++) {
                var th = ths[j];
                var txt = (th.textContent || '').trim().toUpperCase();
                if (shouldAbbrev()) {
                    if (ABBREV[txt] && !th.hasAttribute(ATTR_ORIG)) {
                        th.setAttribute(ATTR_ORIG, th.textContent);
                        th.textContent = ABBREV[txt];
                    }
                } else if (th.hasAttribute(ATTR_ORIG)) {
                    th.textContent = th.getAttribute(ATTR_ORIG);
                    th.removeAttribute(ATTR_ORIG);
                }
            }
        }
    }

    function boot() {
        applyHeaderAbbrev();
        setTimeout(applyHeaderAbbrev, 500);
        setTimeout(applyHeaderAbbrev, 1500);
        window.addEventListener('resize', applyHeaderAbbrev);
        if (window.MutationObserver) {
            var pending = false;
            var mo = new MutationObserver(function () {
                if (pending) return;
                pending = true;
                requestAnimationFrame(function () {
                    pending = false;
                    applyHeaderAbbrev();
                });
            });
            mo.observe(document.body, { childList: true, subtree: true });
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }
